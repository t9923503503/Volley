<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d1a">
<meta name="description" content="Турнирное приложение для пляжного волейбола: счёт, таймеры, ростер, регистрация и синхронизация King of the Court.">
<title>Лютые пляжники !! King of the Court</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="sync-topbar" class="sync-topbar" style="display:none"></div>

<!-- ── NAV ──────────────────────────────────────────────── -->
<nav id="nav">
  <div id="nav-logo" class="nav-logo-container"><div class="brand-main">ЛЮТЫЕ ПЛЯЖНИКИ !!</div><div class="brand-sub">King of the Court</div></div>
  <!-- buttons built by JS -->
</nav>

<!-- Dropdowns are OUTSIDE #nav — appended to <body> by JS -->

<!-- Backdrop: closes dropdown on outside click -->
<div id="dd-backdrop"></div>

<!-- ── SCREENS ───────────────────────────────────────────── -->
<div id="screens"></div>

<!-- ── TOAST ─────────────────────────────────────────────── -->
<div id="toast"></div>
<button id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">▲</button>

<script type="module" src="assets/js/main.js"></script>

<!-- Custom confirm modal -->
<div id="pwd-overlay">
  <div id="pwd-box">
    <div class="pwd-title" id="pwd-title">🔒 РОСТЕР</div>
    <div class="pwd-sub" id="pwd-sub">Введите пароль для доступа</div>
    <input id="pwd-input" type="password" placeholder="Пароль">
    <input id="pwd-input-2" type="password" placeholder="Повторите пароль" style="display:none">
    <div id="pwd-note"></div>
    <div id="pwd-error"></div>
    <button id="pwd-ok">Войти</button>
    <br><button id="pwd-cancel">Отмена</button>
  </div>
</div>
<div id="pcard-overlay" onclick="if(event.target===this)closePcard()">
  <div class="pcard-box" id="pcard-box"></div>
</div>
<div id="confirm-overlay">
  <div id="confirm-box">
    <div id="confirm-msg"></div>
    <div class="confirm-btns">
      <button id="confirm-cancel">Отмена</button>
      <button id="confirm-ok">ОК</button>
    </div>
  </div>
</div>
</body>
</html>
